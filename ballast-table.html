<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <center><img src="Images/logo.png"></center>
  <link rel="stylesheet" href="ballast-table.css">
</head>
<body>
  <main>
    <p id="message" role="status" aria-live="polite"></p>
    <h2>Ballast Log</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Ballast (kg)</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="log"></tbody>
        <tfoot><tr class="new-row">
          <td><input id="person" class="table-input" type="text" placeholder="Name" aria-label="New person's name"></td>
          <td><input id="amount" class="table-input" type="number" min="0" step="0.1" placeholder="kg" aria-label="Ballast amount in kg"></td>
          <td>New</td>
          <td><button id="signOut" class="table-button" type="button">Sign Out</button></td>
        </tr></tfoot>
      </table>
    </div>
  </main>
  <script>
    const key = 'ballast-records-v1';
    const nameInput = document.getElementById('person');
    const amountInput = document.getElementById('amount');
    const message = document.getElementById('message');
    const log = document.getElementById('log');
    let records;
    let editing = -1;
    try { records = JSON.parse(localStorage.getItem(key)) || []; if (!Array.isArray(records)) records = []; }
    catch { records = []; }
    // Keep existing records from the earlier version, without displaying timestamps.
    function signedIn(record) { return Boolean(record.in) || record.status === 'in'; }
    function save() { localStorage.setItem(key, JSON.stringify(records)); render(); }
    function show(text) { message.textContent = text; }
    function cell(row, content) { const td = document.createElement('td'); if (typeof content === 'string') td.textContent = content; row.appendChild(td); return td; }
    function action(label, handler, className = '') {
      const button = document.createElement('button'); button.type = 'button'; button.textContent = label;
      button.className = 'table-button ' + className; button.addEventListener('click', handler); return button;
    }
    function render() {
      log.replaceChildren();
      records.forEach((record, index) => {
        const row = document.createElement('tr');
        const nameCell = cell(row, editing === index ? '' : record.name);
        const amountCell = cell(row, editing === index ? '' : String(record.amount));
        cell(row, signedIn(record) ? 'Signed In' : 'Signed Out');
        const controls = cell(row, ''); controls.className = 'row-actions';
        if (editing === index) {
          const editName = document.createElement('input'); editName.type = 'text'; editName.value = record.name; editName.className = 'table-input'; editName.setAttribute('aria-label', 'Edit name');
          const editAmount = document.createElement('input'); editAmount.type = 'number'; editAmount.min = '0'; editAmount.step = '0.1'; editAmount.value = record.amount; editAmount.className = 'table-input'; editAmount.setAttribute('aria-label', 'Edit ballast amount');
          nameCell.appendChild(editName); amountCell.appendChild(editAmount);
          controls.appendChild(action('Save', () => {
            const name = editName.value.trim(); const amount = Number(editAmount.value);
            if (!name || !editAmount.value.trim() || !Number.isFinite(amount) || amount <= 0) return show('Enter a name and a ballast amount greater than zero.');
            if (!signedIn(record) && records.some((r, i) => i !== index && !signedIn(r) && r.name.toLowerCase() === name.toLowerCase())) return show('That person is already signed out.');
            record.name = name; record.amount = amount; editing = -1; save(); show('Record updated.');
          }));
          controls.appendChild(action('Cancel', () => { editing = -1; render(); }));
        } else {
          if (!signedIn(record)) controls.appendChild(action('Sign In', () => {
            record.in = true; record.status = 'in'; save(); show(record.name + ' signed in successfully.');
          }));
          controls.appendChild(action('Edit', () => { editing = index; show(''); render(); }));
        }
        log.prepend(row);
      });
      if (!records.length) { const row = document.createElement('tr'); const td = cell(row, 'No records yet'); td.colSpan = 4; log.appendChild(row); }
    }
    document.getElementById('signOut').addEventListener('click', () => {
      const name = nameInput.value.trim(); const amount = Number(amountInput.value);
      if (!name || !amountInput.value.trim() || !Number.isFinite(amount) || amount <= 0) return show('Enter a name and a ballast amount greater than zero.');
      if (records.some(r => r.name.toLowerCase() === name.toLowerCase() && !signedIn(r))) return show('This person is already signed out. Sign them in using their table row first.');
      records.push({ name, amount, status: 'out' });
      editing = -1; save(); show(name + ' signed out with ' + amount + ' kg.'); nameInput.value = ''; amountInput.value = '';
    });
    render();
  </script>
</body>
</html>
